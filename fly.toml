app = 'parcelgps-mcp'
primary_region = 'ams'

[build]

[env]
  MCP_PORT = "8080"
  CATASTROGPS_API_URL = "https://api.parcelgps.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
